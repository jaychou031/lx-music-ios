          python3 -c "
          import base64, sys
          raw = open(sys.argv[1]).read()
          open(sys.argv[2], 'wb').write(base64.b64decode(raw))
          " "$LX_ROOT/adapter.b64" "$LX_ROOT/adapter.tar.gz"
          gzip -t "$LX_ROOT/adapter.tar.gz"
          tar -xzf "$LX_ROOT/adapter.tar.gz" -C "$LX_ROOT/adapter" --strip-components=1
          echo "=== 适配层文件 ==="
          find "$LX_ROOT/adapter" -type f | sort

      - name: 注入适配层（严格校验，锚点不符立即失败）
        run: |
          set -e
          python3 "$LX_ROOT/adapter/patch_official_ios.py" "$LX_ROOT/src" "$LX_ROOT/adapter"

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装 npm 依赖
        run: |
          set -e
          cd "$LX_ROOT/src"
          npm install --no-audit --no-fund || npm install --no-audit --no-fund --legacy-peer-deps
          echo "=== 关键依赖检查 ==="
          test -d node_modules/react-native-fs && echo "react-native-fs OK"
          test -d node_modules/react-native-track-player && echo "react-native-track-player OK"
          test -d node_modules/react-native-navigation && echo "react-native-navigation OK"
          test -d node_modules/pako && echo "pako OK"

      - name: 安装 CocoaPods 依赖
        run: |
          set -e
          set -o pipefail
          cd "$LX_ROOT/src/ios"
          pod install 2>&1 | tee "$LX_ROOT/pod-install.log"
          test -f LxMusicMobile.xcworkspace/contents.xcworkspacedata
          echo "=== LXMusicIOS Pod 是否进入工程 ==="
          grep -c "LXMusicIOS" Podfile.lock || true

      - name: xcodebuild archive（关闭代码签名）
        run: |
          set -e
          set -o pipefail
          ARCHIVE="$LX_ROOT/build/LxMusicMobile.xcarchive"
          mkdir -p "$LX_ROOT/build"
          cd "$LX_ROOT/src"
          xcodebuild \
            -workspace ios/LxMusicMobile.xcworkspace \
            -scheme LxMusicMobile \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE" \
            -derivedDataPath "$LX_ROOT/derived" \
            -allowProvisioningUpdates \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            2>&1 | tee "$LX_ROOT/xcodebuild.log"
          test -d "$ARCHIVE/Products/Applications/LxMusicMobile.app"

      - name: 输出编译错误摘要（失败时，网页直接可见）
        if: failure()
        run: |
          set +e
          LOG="$LX_ROOT/xcodebuild.log"
          OUT="$LX_ROOT/compile-errors.txt"
          {
            echo "## 编译错误摘要"
            echo ""
            echo '```text'
            if [ -f "$LOG" ]; then
              grep -nE '(^|[^_[:alnum:]])(fatal )?error:' "$LOG" | grep -v 'In file included from' | head -60
            else
              echo "(未找到 xcodebuild.log，失败发生在更早的步骤)"
            fi
            echo '```'
          } > "$OUT" 2>&1
          echo "===== compile-errors.txt（可直接复制发回定位） ====="
          cat "$OUT"
          echo ""
          echo "===== 每条 error 的前后 6 行 ====="
          if [ -f "$LOG" ]; then
            grep -nE '(^|[^_[:alnum:]])(fatal )?error:' "$LOG" | grep -v 'In file included from' | head -25 | cut -d: -f1 | while read -r n; do
              s=$((n > 6 ? n - 6 : 1)); e=$((n + 6))
              echo "----- $LOG : $s-$e -----"
              sed -n "${s},${e}p" "$LOG"
            done
          fi
          echo ""
          echo "===== 写入 Job Summary ====="
          if [ -n "$GITHUB_STEP_SUMMARY" ]; then cat "$OUT" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: 校验构建产物（JS bundle / 最低系统版本）
        run: |
          set -e
          APP="$LX_ROOT/build/LxMusicMobile.xcarchive/Products/Applications/LxMusicMobile.app"
          echo "=== app 内容 ==="
          ls -la "$APP" | head -30
          test -f "$APP/main.jsbundle" || { echo "缺少 main.jsbundle，app 会白屏"; exit 1; }
          echo "main.jsbundle 大小: $(stat -f%z "$APP/main.jsbundle") bytes"
          python3 -c "
          import plistlib, sys
          p = plistlib.load(open(sys.argv[1], 'rb'))
          v = p.get('MinimumOSVersion', '')
          print('MinimumOSVersion =', v)
          assert v.startswith('14.'), '最低系统版本不是 14.x: ' + str(v)
          print('CFBundleDisplayName =', p.get('CFBundleDisplayName'))
          " "$APP/Info.plist"

      - name: 打包未签名 IPA
        run: |
          set -e
          APP="$LX_ROOT/build/LxMusicMobile.xcarchive/Products/Applications/LxMusicMobile.app"
          cd "$LX_ROOT/ipa"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "LxMusicMobile-ios14-unsigned.ipa" Payload
          ls -lh "LxMusicMobile-ios14-unsigned.ipa"
          echo "IPA 内条目数: $(unzip -l LxMusicMobile-ios14-unsigned.ipa | tail -1)"

      - name: 上传 IPA（下载后解压一次即得 .ipa）
        uses: actions/upload-artifact@v4
        with:
          name: LxMusicMobile-ios14-unsigned-ipa
          path: /tmp/lx-official-ios-build/ipa/LxMusicMobile-ios14-unsigned.ipa
          retention-days: 14
          if-no-files-found: error

      - name: 上传构建日志（失败时用于定位）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            /tmp/lx-official-ios-build/*.log
            /tmp/lx-official-ios-build/compile-errors.txt
            /tmp/lx-official-ios-build/adapter/patch_official_ios.py
          if-no-files-found: ignore

      - name: 完成提示
        if: success()
        run: |
          echo "============================================================"
          echo "构建完成：下载 artifact 'LxMusicMobile-ios14-unsigned-ipa'"
          echo "artifact 是 zip，解压一次即可得到 .ipa 文件"
          echo "最低系统版本：iOS 14.0+"
          echo "============================================================"
