# ============================================================================
# 洛雪音乐助手 iOS 14+ 未签名 IPA —— 官方源码底座 + 独立 iOS 适配层
# ----------------------------------------------------------------------------
# 全程免费：GitHub 免费账号 + Public 仓库 + macOS 标准 runner。
# 不需要 Apple Developer 账号、证书、Secrets，也不需要 Mac。
#
# 用法（iPhone Safari 即可操作）：
#   1. 新建一个 **Public** 仓库
#   2. 新建文件 .github/workflows/build.yml，把本文件**全文**粘贴进去并提交
#   3. Actions -> 本 workflow -> Run workflow（保持默认参数）
#   4. 构建完成后下载 artifact（是一个 zip），解压一次得到 .ipa
#
# 原理：本 workflow 下载官方 lyswhut/lx-music-mobile v1.9.2 源码，
#       再把内嵌的独立 iOS 适配层（原生 Pod + 平台差异 JS 文件）注入进去，
#       最后用 xcodebuild 关闭代码签名 archive，打成未签名 .ipa。
# ============================================================================
name: 洛雪音乐 iOS14 未签名 IPA（官方源码独立适配）

on:
  workflow_dispatch:
    inputs:
      official_tag:
        description: '官方源码 tag（建议保持 v1.9.2，换版本可能因源码结构变化导致注入失败）'
        required: false
        default: 'v1.9.2'

env:
  OFFICIAL_TAG: ${{ github.event.inputs.official_tag || 'v1.9.2' }}
  LX_ROOT: ${{ runner.temp }}/lx

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: 打印构建环境
        run: |
          echo "=== macOS ==="
          sw_vers
          echo "=== 可用 Xcode ==="
          ls -d /Applications/Xcode_*.app 2>/dev/null || true
          echo "=== 默认 Xcode ==="
          xcodebuild -version
          echo "=== CocoaPods ==="
          pod --version

      - name: 选择 Xcode（RN 0.73 避开 clang 17 / RCT-Folly 兼容问题）
        run: |
          set -e
          for v in 16.2 16.1 16.0 15.4; do
            app="/Applications/Xcode_${v}.app"
            if [ -d "$app" ]; then
              echo "选用 Xcode $v"
              sudo xcode-select -s "$app/Contents/Developer"
              break
            fi
          done
          xcodebuild -version
          sudo xcodebuild -license accept || true

      - name: 下载官方 v1.9.2 源码
        run: |
          set -e
          mkdir -p "$LX_ROOT/src" "$LX_ROOT/adapter" "$LX_ROOT/ipa"
          echo "下载官方 tag: $OFFICIAL_TAG"
          curl -fsSL --retry 3 --max-time 300 \
            "https://codeload.github.com/lyswhut/lx-music-mobile/tar.gz/refs/tags/${OFFICIAL_TAG}" \
            -o "$LX_ROOT/official.tar.gz"
          gzip -t "$LX_ROOT/official.tar.gz"
          tar -xzf "$LX_ROOT/official.tar.gz" -C "$LX_ROOT/src" --strip-components=1
          test -f "$LX_ROOT/src/package.json"
          echo "官方源码文件数: $(find "$LX_ROOT/src" -type f | wc -l | tr -d ' ')"
          grep -m1 '"version"' "$LX_ROOT/src/package.json"

      - name: 解压 iOS 独立适配层
